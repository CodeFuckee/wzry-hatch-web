<!DOCTYPE html>

<head>

<script>
/* 主题引导:与主页共用 localStorage 键,在样式渲染前执行避免闪色 */
(function () {
  window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @line ' + e.lineno); });
  window.addEventListener('unhandledrejection', e => { (window.__errs = window.__errs || []).push('rejection: ' + (e.reason && e.reason.message || e.reason)); });
  var t;
  try { t = localStorage.getItem('wzry-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  /* Material Symbols 图标字体(本地,与主页一致) */
  @font-face {
    font-family: 'Material Symbols Outlined';
    src: url('./vendor/fonts/material-symbols-outlined.woff2') format('woff2');
    font-display: block;
  }
  .ms {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal;
    font-size: 24px; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap;
    word-wrap: normal; direction: ltr;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== M3 蓝色主题 tokens(浅色,与主页一致) ===== */
  :root {
    color-scheme: light;
    --md-sys-color-primary: #0B57D0;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #D3E3FD;
    --md-sys-color-on-primary-container: #041E49;
    --md-sys-color-secondary-container: #C2E7FF;
    --md-sys-color-on-secondary-container: #001E2C;
    --md-sys-color-background: #F9F9FF;
    --md-sys-color-on-background: #1A1B21;
    --md-sys-color-surface: #F9F9FF;
    --md-sys-color-on-surface: #1A1B21;
    --md-sys-color-surface-variant: #E0E2EC;
    --md-sys-color-on-surface-variant: #44474E;
    --md-sys-color-surface-container-lowest: #FFFFFF;
    --md-sys-color-surface-container-low: #F3F3FA;
    --md-sys-color-surface-container: #EDF0F7;
    --md-sys-color-surface-container-high: #E7EAF1;
    --md-sys-color-surface-container-highest: #E2E4EB;
    --md-sys-color-outline: #74777F;
    --md-sys-color-outline-variant: #C4C6D0;
    --app-win: #146C2E;
    --app-red: #B3261E;
    --app-blue: #0B57D0;
    --app-ease: cubic-bezier(0.2, 0, 0, 1);
    --md-icon-font: 'Material Symbols Outlined';
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-sys-color-primary: #A8C7FA;
    --md-sys-color-on-primary: #062E6F;
    --md-sys-color-primary-container: #0842A0;
    --md-sys-color-on-primary-container: #D3E3FD;
    --md-sys-color-secondary-container: #004A66;
    --md-sys-color-on-secondary-container: #C2E7FF;
    --md-sys-color-background: #111318;
    --md-sys-color-on-background: #E3E2E9;
    --md-sys-color-surface: #111318;
    --md-sys-color-on-surface: #E3E2E9;
    --md-sys-color-surface-variant: #44474E;
    --md-sys-color-on-surface-variant: #C4C6D0;
    --md-sys-color-surface-container-lowest: #0C0E13;
    --md-sys-color-surface-container-low: #191C20;
    --md-sys-color-surface-container: #1D2024;
    --md-sys-color-surface-container-high: #282A2F;
    --md-sys-color-surface-container-highest: #33353A;
    --md-sys-color-outline: #8E9099;
    --md-sys-color-outline-variant: #44474E;
    --app-win: #6DD58C;
    --app-red: #F2B8B5;
    --app-blue: #A8C7FA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-surface);
    font-family: 'Roboto', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
  }

  /* ===== 顶栏 ===== */
  .bp-bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    height: 60px; padding: 0 16px;
    background: var(--md-sys-color-surface);
    box-shadow: 0 1px 3px rgba(0,0,0,.10);
  }
  .bp-bar .back {
    display: flex; align-items: center; gap: 4px;
    color: var(--md-sys-color-on-surface-variant); text-decoration: none;
    font-size: 13px; padding: 8px 10px; border-radius: 20px;
  }
  .bp-bar .back:hover { background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); }
  .bp-bar .ttl { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
  .bp-bar .sp { flex: 1; }
  .bp-bar .op {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--md-sys-color-outline-variant); background: transparent;
    color: var(--md-sys-color-on-surface); font-size: 13px;
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
    white-space: nowrap;
  }
  .bp-bar .op:hover:not(:disabled) { background: var(--md-sys-color-surface-container-high); }
  .bp-bar .op:disabled { opacity: .4; cursor: default; }
  .bp-bar .op .ms { font-size: 18px; }
  .bp-bar .op.warn { border-color: var(--app-red); color: var(--app-red); font-weight: 600; }
  #themeBtn { color: var(--md-sys-color-on-surface-variant); }
  .bp-bar .data-ver {
    font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    white-space: nowrap; padding: 5px 12px;
    border: 1px dashed var(--md-sys-color-outline-variant); border-radius: 14px;
  }

  /* ===== BP 台 ===== */
  .board {
    margin: 18px auto 0; padding: 0 16px;
    display: grid; grid-template-columns: 1fr minmax(300px, 1.1fr) 1fr;
    gap: 14px; align-items: stretch;
  }
  .side {
    background: var(--md-sys-color-surface-container-low);
    border-radius: 16px; padding: 14px;
    border-top: 3px solid var(--side-c);
    transition: box-shadow .2s var(--app-ease);
    display: flex; flex-direction: column;
  }
  .side.blue { --side-c: var(--app-blue); }
  .side.red  { --side-c: var(--app-red); }
  /* 禁用阶段:当前操作方一侧高亮提示 */
  .side.active-side { box-shadow: 0 0 0 2px var(--side-c); }
  .side .side-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--side-c); }
  .side .side-name .ms { font-size: 18px; }
  .side .grp-l { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin: 12px 0 6px; display: flex; justify-content: space-between; }
  .side .grp-l .cnt { font-variant-numeric: tabular-nums; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot {
    width: 56px; height: 56px; border-radius: 12px; overflow: hidden; position: relative;
    border: 2px dashed var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--md-sys-color-on-surface-variant);
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot-ban { width: 46px; height: 46px; border-radius: 50%; }
  .slot.filled { border-style: solid; border-color: var(--side-c); }
  .slot.banned-slot.filled::after {
    content: '✕'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: var(--app-red);
    background: rgba(0,0,0,.35);
  }
  .slot.latest { box-shadow: 0 0 0 2px var(--side-c); }

  /* 中控区 */
  .center {
    background: var(--md-sys-color-surface-container-low);
    border-radius: 16px; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center;
  }
  .turn { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  .turn .b { color: var(--app-blue); }
  .turn .r { color: var(--app-red); }
  .turn-sub { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 3px; line-height: 1.7; }
  .timeline { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .timeline[hidden] { display: none; }
  .tl {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--md-sys-color-outline-variant);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--md-sys-color-on-surface-variant);
  }
  .tl.blue { border-color: var(--app-blue); color: var(--app-blue); }
  .tl.red { border-color: var(--app-red); color: var(--app-red); }
  .tl.done { border-color: transparent; color: var(--md-sys-color-surface); }
  .tl.done.blue { background: var(--app-blue); }
  .tl.done.red { background: var(--app-red); }
  .tl.cur { animation: pulse 1.1s var(--app-ease) infinite; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }

  /* 禁用阶段:操作方开关 + 开始选人 */
  .ban-ctl { display: flex; gap: 10px; align-items: center; }
  .ban-ctl[hidden] { display: none; }
  .side-toggle {
    --tc: var(--app-blue);
    border: 2px solid var(--tc); background: transparent; color: var(--tc);
    font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 20px;
    cursor: pointer; opacity: .5;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .side-toggle .ms { font-size: 17px; }
  .side-toggle.red { --tc: var(--app-red); }
  .side-toggle.on { opacity: 1; background: color-mix(in srgb, var(--tc) 16%, transparent); box-shadow: 0 0 0 2px var(--tc); }
  /* 先选方切换 */
  .fp-toggle {
    border: 1px dashed var(--md-sys-color-outline); background: transparent;
    color: var(--md-sys-color-on-surface); font-size: 13px;
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .fp-toggle:hover { background: var(--md-sys-color-surface-container-high); }
  .fp-toggle .ms { font-size: 17px; }
  .fp-toggle .b { color: var(--app-blue); font-weight: 700; }
  .fp-toggle .r { color: var(--app-red); font-weight: 700; }
  .fp-toggle[hidden] { display: none; }
  .fp-toggle .fp-hint { font-size: 11px; color: var(--md-sys-color-on-surface-variant); font-weight: 400; }
  .fp-tag {
    margin-left: 8px; padding: 1px 8px; border-radius: 8px;
    font-size: 10.5px; font-weight: 700;
    background: var(--md-sys-color-tertiary-container, #C4EBFF); color: #001F24;
  }
  .fp-tag[hidden] { display: none; }
  .start-pick {
    border: none; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 22px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .start-pick:hover { filter: brightness(1.08); }
  .start-pick .ms { font-size: 18px; }
  .start-pick[hidden] { display: none; }
  .finish {
    font-size: 16px; font-weight: 600; color: var(--app-win);
    display: flex; align-items: center; gap: 8px;
  }
  .finish[hidden] { display: none; }
  .verdict { font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); line-height: 1.8; }

  /* ===== 对方意图分析(禁用护核推断):直接标注在英雄池卡片上 ===== */
  .pool .p-card .intent-badges {
    position: absolute; right: 4px; bottom: 25px; z-index: 2;
    display: inline-flex; gap: 2px;
  }
  .pool .p-card .intent-val {
    padding: 1px 5px; border-radius: 8px;
    background: var(--md-sys-color-primary); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1.4;
  }
  /* 配色随指向侧:蓝=蓝方禁用指向,红=红方禁用指向;双侧指向拆成两个标签 */
  .pool .p-card .intent-val.intent-blue { background: var(--app-blue); }
  .pool .p-card .intent-val.intent-red { background: var(--app-red); }
  .intent-legend {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--md-sys-color-on-surface-variant);
  }
  .intent-legend .ms { font-size: 14px; color: var(--md-sys-color-primary); }
  .intent-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .intent-legend .dot.b { background: var(--app-blue); }
  .intent-legend .dot.r { background: var(--app-red); }
  .intent-legend[hidden] { display: none; }

  /* ===== 英雄池 ===== */
  .pool-wrap { margin: 16px auto 40px; padding: 0 16px; }
  .pool-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  md-outlined-text-field#poolSearch { flex: 1 1 220px; max-width: 320px; --md-outlined-text-field-container-shape: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips md-filter-chip { --md-filter-chip-container-shape: 8px; }
  .pool {
    margin-top: 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px;
  }
  .pool .empty { grid-column: 1/-1; padding: 32px 0; text-align: center; color: var(--md-sys-color-on-surface-variant); }
  .p-card {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    background: var(--md-sys-color-surface-container); display: block;
  }
  .p-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .p-card .pn {
    font-size: 12px; text-align: center; padding: 4px 2px 5px;
    color: var(--md-sys-color-on-surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p-card:hover { outline: 2px solid var(--md-sys-color-primary); }
  .p-card:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
  .p-card.locked { cursor: default; }
  .p-card.is-banned img, .p-card.is-banned .pn,
  .p-card.is-picked img, .p-card.is-picked .pn { opacity: .28; filter: grayscale(1); }
  .p-card.is-banned::after, .p-card.is-picked::after {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -72%);
    font-size: 34px; font-weight: 700;
  }
  /* 标记颜色随操作方:蓝方操作=蓝,红方操作=红,双方都禁=蓝→红渐变 */
  .p-card.is-banned::after { content: '✕'; color: var(--app-red); }
  .p-card.is-picked::after { content: '✓'; color: var(--app-win); }
  .p-card.by-blue::after { color: var(--app-blue); }
  .p-card.by-red::after { color: var(--app-red); }
  .p-card.both.is-banned::after {
    background: linear-gradient(105deg, var(--app-blue) 35%, var(--app-red) 65%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .p-card .own {
    position: absolute; top: 6px; z-index: 2;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .own.b { background: var(--app-blue); right: 6px; }
  .own.b.left { right: 27px; }
  .own.r { background: var(--app-red); right: 6px; }
  .trank {
    position: absolute; top: 0; left: 0; z-index: 2;
    padding: 0 6px; border-radius: 0 0 8px 0; font-size: 10px; font-weight: 700;
    background: rgba(20,22,30,.72); color: #fff;
  }

  .t0{color:#FF7D71} .t1{color:#FFB95C} .t2{color:#E4C94F} .t3{color:#A8C7DC} .t4{color:#9AA0A6}

  @media (max-width: 860px) {
    .board { grid-template-columns: 1fr; }
    .slots { justify-content: center; }
    .side .grp-l { margin-top: 10px; }
  }
  /* 宽屏撑满后槽位适当放大,避免两侧面板空旷 */
  @media (min-width: 1600px) {
    .slot { width: 64px; height: 64px; }
  }
  @media (max-width: 640px) {
    .bp-bar { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 6px; }
    .bp-bar .back, .bp-bar .op { white-space: nowrap; padding: 6px 10px; }
    .bp-bar .ttl { font-size: 16px; }
  }
</style>

  <a class="back" href="index.html"><span class="ms" style="font-size:18px">arrow_back</span>数据站</a>

<script type="module">
  import '@material/web/all.js';

  const { heroes, relations } = window.HERO_DATA;
  const byId = {}; heroes.forEach(h => byId[h.ename] = h);

  /* 顶栏数据版本 = 统计榜单版本(缺字段回退抓取时间) */
  const dataBuilt = window.HERO_DATA.dataFetchedAt || window.HERO_DATA.builtAt;
  const boardVer = String(heroes.reduce((m, h) => Math.max(m, +(h.camp_stats && h.camp_stats.source_version) || 0), 0) || '');
  const verEl = document.getElementById('dataVer');
  if (boardVer && verEl) {
    verEl.textContent = '数据版本 ' + boardVer;
    verEl.title = `营地统计榜单版本 ${boardVer} · 数据抓取 ${dataBuilt || '—'}`;
  } else if (dataBuilt && verEl) {
    verEl.textContent = '数据版本 ' + dataBuilt;
  }

  /* ---------- 主题切换(与主页共用 localStorage) ---------- */
  const themeBtn = document.getElementById('themeBtn');
  function syncThemeBtn() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.querySelector('md-icon').textContent = dark ? 'light_mode' : 'dark_mode';
    themeBtn.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('wzry-theme', next); } catch (e) {}
    syncThemeBtn();
  });
  syncThemeBtn();

  /* ---------- 工具 ---------- */
  const pct = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(d) + '%';
  const signed = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(d); /* 克制值(营地口径),非百分比 */
  const tClass = t => 't' + (String(t).match(/\d/) ? String(t).match(/\d/)[0] : '3');
  const BAN_MAX = 5, PICK_MAX = 5;

  /* ---------- BP 状态机:现行排位规则 ----------
     禁用阶段:双方"同时"各禁 5 名(无先后顺序),允许双方禁同一英雄;
     选用阶段:先选方按 1-2-2-2-2-1 选满(先选方可切换),各选满 5 名;
     悔一手 = 通用操作栈回退,可跨阶段(选人撤空自动回到禁用阶段)。 */
  const pickSteps = () => {
    const a = firstPick, b = firstPick === 'blue' ? 'red' : 'blue';
    return [{ s: a }, { s: b }, { s: b }, { s: a }, { s: a }, { s: b }, { s: b }, { s: a }, { s: a }, { s: b }];
  };
  const SIDE_NAME = { blue: '蓝方', red: '红方' };
  let phase = 'ban';      // ban | pick
  let banSide = 'blue';   // 禁用阶段当前操作方
  let firstPick = 'blue'; // 先选方(仅禁用阶段可切换)
  let pickCur = 0;        // 选用阶段进度 0..10
  const slots = { blue: { ban: [], pick: [] }, red: { ban: [], pick: [] } };
  const ops = [];         // 操作栈 {side, action, id},悔一手逐条回退

  const inUse = id =>
    slots.blue.ban.includes(id) || slots.red.ban.includes(id) ||
    slots.blue.pick.includes(id) || slots.red.pick.includes(id);
  const pickCount = () => slots.blue.pick.length + slots.red.pick.length;

  /* ---------- 英雄池筛选 ---------- */
  let curType = '全部', kw = '';
  const chipsEl = document.getElementById('chips');
  const types = ['全部', ...new Set(heroes.map(h => h.hero_type_name).filter(Boolean))];
  types.forEach(t => {
    const chip = document.createElement('md-filter-chip');
    chip.label = t;
    if (t === '全部') chip.selected = true;
    chip.addEventListener('click', () => {
      curType = t;
      chipsEl.querySelectorAll('md-filter-chip').forEach(x => x.selected = false);
      chip.selected = true;
      renderPool();
    });
    chipsEl.appendChild(chip);
  });
  document.getElementById('poolSearch').addEventListener('input', e => { kw = e.target.value.trim(); renderPool(); });

  function poolHeroes() {
    return heroes.filter(h =>
      (curType === '全部' || (h.hero_type_name || '').includes(curType)) &&
      (!kw || (h.cname || '').includes(kw) || (h.title || '').includes(kw)));
  }

  function badgesHtml(id) {
    const bs = [];
    if (slots.blue.pick.includes(id)) bs.push('<span class="own b" title="蓝方选用">选</span>');
    else if (slots.blue.ban.includes(id)) bs.push('<span class="own b' + (slots.red.ban.includes(id) ? ' left' : '') + '" title="蓝方禁用">禁</span>');
    if (slots.red.pick.includes(id)) bs.push('<span class="own r" title="红方选用">选</span>');
    else if (slots.red.ban.includes(id)) bs.push('<span class="own r" title="红方禁用">禁</span>');
    return bs.join('');
  }
  const isBanned = id => slots.blue.ban.includes(id) || slots.red.ban.includes(id);

  function renderPool() {
    const pool = document.getElementById('pool');
    /* 被禁英雄不再出现在池中(禁用情况见上方两侧的禁用槽位);选用阶段的已选英雄保留(灰化打勾) */
    let list = poolHeroes().filter(h => !isBanned(h.ename));
    /* 有禁用时英雄池按意图排序:红方指向(克制值降序)在前 → 蓝方指向次之 → 无指向保持原序垫后 */
    if (intentMap.size) {
      const sig = list.filter(h => intentMap.get(h.ename));
      const rest = list.filter(h => !intentMap.get(h.ename));
      sig.sort((a, b) => {
        const va = intentMap.get(a.ename), vb = intentMap.get(b.ename);
        return (vb.red - va.red) || (vb.blue - va.blue);
      });
      list = [...sig, ...rest];
    }
    if (!list.length) { pool.innerHTML = '<div class="empty">没有匹配的英雄</div>'; return; }
    pool.innerHTML = list.map(h => {
      const s = h.camp_stats;
      const tr = s && s.tRank ? `<span class="trank ${tClass(s.tRank)}">${s.tRank}</span>` : '';
      const banB = slots.blue.ban.includes(h.ename), banR = slots.red.ban.includes(h.ename);
      const pickB = slots.blue.pick.includes(h.ename), pickR = slots.red.pick.includes(h.ename);
      const used = banB || banR || pickB || pickR;
      const st = used
        ? (banB || banR ? '已禁用 ' : '已选用 ') + h.cname
        : (phase === 'ban' ? `禁用给${SIDE_NAME[banSide]} ` : '选用 ') + h.cname;
      /* 状态类 + 归属方类:标记(✓/✕)颜色随操作方,双方都禁用渐变 */
      let stateCls = '';
      if (banB || banR) stateCls = 'is-banned ' + (banB && banR ? 'both' : banB ? 'by-blue' : 'by-red');
      else if (pickB || pickR) stateCls = 'is-picked ' + (pickB ? 'by-blue' : 'by-red');
      /* 意图标注:该英雄被禁用来源克制 → 克制值徽章(悬停看来源明细) */
      const iv = intentMap.get(h.ename);
      let intentHtml = '';
      if (iv) {
        const tip = side => `克制值:${SIDE_NAME[side]}禁用的 ${iv.parts.filter(p => p.side === side)
          .map(p => `${p.banName} 克制 ${h.cname} ${signed(p.param)}`).join('，')}；克制它的英雄已被禁用,对方可能想选`;
        /* 双侧同时指向 → 红/蓝两个独立标签(红在前,与红值优先排序一致);单侧 → 单标签 */
        if (iv.red > 0) intentHtml += `<span class="intent-val intent-red" title="${tip('red')}">${signed(iv.red)}</span>`;
        if (iv.blue > 0) intentHtml += `<span class="intent-val intent-blue" title="${tip('blue')}">${signed(iv.blue)}</span>`;
        if (intentHtml) intentHtml = `<span class="intent-badges">${intentHtml}</span>`;
      }
      return `<div class="p-card ${used ? stateCls + ' locked' : ''}" data-id="${h.ename}"
        role="button" tabindex="0" aria-label="${st}" title="${h.cname} · ${h.hero_type_name || ''}${s ? ' · 胜率 ' + pct(s.winRate) : ''}">
        <img loading="lazy" src="${h.camp_icon}" alt="${h.cname}">${tr}${badgesHtml(h.ename)}${intentHtml}
        <div class="pn">${h.cname}</div>
      </div>`;
    }).join('');
    pool.querySelectorAll('.p-card').forEach(el => {
      el.addEventListener('click', () => act(+el.dataset.id));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(+el.dataset.id); }
      });
    });
  }

  /* ---------- 执行 / 悔一手 / 开始选人 / 重置 ---------- */
  function act(id) {
    if (phase === 'ban') {
      /* 双方可禁同一英雄,仅拦截同一方重复禁 */
      if (slots[banSide].ban.length >= BAN_MAX || slots[banSide].ban.includes(id)) return;
      slots[banSide].ban.push(id);
      ops.push({ side: banSide, action: 'ban', id });
    } else {
      if (pickCur >= pickSteps().length) return;
      if (inUse(id)) return; /* 被任一方禁用的不可选 */
      const st = pickSteps()[pickCur];
      slots[st.s].pick.push(id);
      ops.push({ side: st.s, action: 'pick', id });
      pickCur++;
    }
    renderAll();
  }
  function undo() {
    const op = ops.pop();
    if (!op) return;
    slots[op.side][op.action].pop();
    if (op.action === 'pick') pickCur--;
    /* 选人撤空则退回禁用阶段,允许继续修改禁用 */
    if (phase === 'pick' && pickCount() === 0) phase = 'ban';
    renderAll();
  }
  function startPick() {
    if (phase !== 'ban') return;
    phase = 'pick';
    renderAll();
  }
  function reset() {
    phase = 'ban'; banSide = 'blue'; firstPick = 'blue'; pickCur = 0;
    slots.blue.ban = []; slots.blue.pick = [];
    slots.red.ban = []; slots.red.pick = [];
    ops.length = 0;
    syncFpBtn();
    renderAll();
  }

  /* ---------- 对方意图分析:禁用护核推断 ----------
     对方禁掉 B,B 克制 X 的证据取双向两榜(营地两榜为独立 top3,不可互推):
     ① X 的「被克制」榜含 B(bkzParam);② B 的「克制」榜含 X(kzParam)。
     任一成立即 B 是 X 的天敌——禁它往往是为了护住想玩的 X。
     计分规则:同一对 (B,X) 在两张榜同现时只计一次(取较大值,不重复累加);
     多个被禁英雄克制同一英雄时,各取一次后求和作为候选得分,全量按分排序;
     已被禁/已选的英雄不参与。
     方向语义依据知识库 camp-relations-direction-semantics.md。 */
  function bpIntent(bannedIds, excludeIds) {
    const out = [];
    for (const h of heroes) {
      if (excludeIds.has(h.ename)) continue;
      const bk = relations[h.ename] && relations[h.ename]['被克制'] && relations[h.ename]['被克制'].list;
      let score = 0;
      const parts = [];
      for (const B of bannedIds) {
        const b = bk && bk.find(e => e.bkzHeroId === B);
        const kzL = relations[B] && relations[B]['克制'] && relations[B]['克制'].list;
        const k = kzL && kzL.find(e => e.kzHeroId === h.ename);
        /* 两榜同现 = 同一对克制关系,取较大值只计一次 */
        const p = Math.max(b && b.bkzParam > 0 ? b.bkzParam : 0,
                           k && k.kzParam > 0 ? k.kzParam : 0);
        if (p > 0) {
          score += p;
          parts.push({ banId: B, banName: (byId[B] || {}).cname || ('英雄' + B), param: p });
        }
      }
      if (score > 0) {
        parts.sort((a, b) => b.param - a.param);
        out.push({ id: h.ename, name: h.cname, icon: h.camp_icon, role: h.hero_type_name || '', score, parts });
      }
    }
    out.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'zh'));
    return out;
  }
  window.__bpIntent = bpIntent; /* 测试钩子 */

  let intentMap = new Map(); /* 英雄 id -> {score, blue, red, parts},renderPool 据此标注卡片 */
  function renderIntent() {
    /* 按侧分别评分后合并:徽章配色随指向侧(蓝/红/双侧渐变),数值为两侧求和 */
    const exclude = new Set([...slots.blue.ban, ...slots.red.ban, ...slots.blue.pick, ...slots.red.pick]);
    intentMap = new Map();
    for (const side of ['blue', 'red']) {
      const bans = slots[side].ban;
      if (!bans.length) continue;
      for (const c of bpIntent(bans, exclude)) {
        const e = intentMap.get(c.id)
          || { id: c.id, name: c.name, icon: c.icon, score: 0, blue: 0, red: 0, parts: [] };
        e.score += c.score;
        e[side] += c.score;
        e.parts.push(...c.parts.map(p => ({ ...p, side })));
        intentMap.set(c.id, e);
      }
    }
    document.getElementById('intentLegend').hidden = intentMap.size === 0;
  }

  /* ---------- 渲染 ---------- */
  function slotHtml(id, kind, latest) {
    const h = byId[id];
    const cls = ['slot', kind === 'ban' ? 'slot-ban' : '', 'filled', latest ? 'latest' : ''].join(' ');
    return `<div class="${cls}" title="${h ? h.cname : ''}">${h ? `<img src="${h.camp_icon}" alt="${h.cname}">` : ''}</div>`;
  }
  function renderSlots() {
    const last = ops[ops.length - 1] || null;
    for (const side of ['blue', 'red']) {
      for (const kind of ['ban', 'pick']) {
        const el = document.getElementById(side + kind[0].toUpperCase() + kind.slice(1) + 's');
        const arr = slots[side][kind];
        const total = kind === 'ban' ? BAN_MAX : PICK_MAX;
        el.innerHTML = arr.map(id => slotHtml(id, kind, !!last && last.id === id && last.action === kind && last.side === side)).join('') +
          Array.from({ length: total - arr.length }, () => `<div class="slot ${kind === 'ban' ? 'slot-ban' : ''}">${kind === 'ban' ? '禁' : '选'}</div>`).join('');
      }
    }
    document.getElementById('blueBanCnt').textContent = `${slots.blue.ban.length}/${BAN_MAX}`;
    document.getElementById('redBanCnt').textContent = `${slots.red.ban.length}/${BAN_MAX}`;
  }
  function renderTimeline() {
    const tl = document.getElementById('timeline');
    tl.hidden = phase !== 'pick';
    const steps = pickSteps();
    tl.innerHTML = steps.map((st, i) => {
      const cls = ['tl', st.s, i < pickCur ? 'done ' + st.s : '', i === pickCur ? 'cur ' + st.s : ''].join(' ');
      return `<span class="${cls}" title="第 ${i + 1} 手 · ${SIDE_NAME[st.s]} 选用">${i + 1}</span>`;
    }).join('');
  }
  function syncFpBtn() {
    const btn = document.getElementById('fpBtn');
    const other = firstPick === 'blue' ? 'red' : 'blue';
    btn.innerHTML = `<span class="ms">swap_horiz</span>先选方:<span class="${firstPick[0]}">${SIDE_NAME[firstPick]}</span><span class="fp-hint">点切${SIDE_NAME[other]}</span>`;
  }
  function renderTurn() {
    const turn = document.getElementById('turnText');
    const finish = document.getElementById('finishTip');
    const banCtl = document.getElementById('banCtl');
    const startBtn = document.getElementById('startPick');
    const fpBtn = document.getElementById('fpBtn');
    const undoBtn = document.getElementById('undoBtn');
    undoBtn.disabled = ops.length === 0;
    fpBtn.hidden = phase !== 'ban';
    document.getElementById('fpTagBlue').hidden = !(phase === 'pick' && firstPick === 'blue');
    document.getElementById('fpTagRed').hidden = !(phase === 'pick' && firstPick === 'red');
    document.getElementById('sideBlue').classList.toggle('active-side', phase === 'ban' && banSide === 'blue');
    document.getElementById('sideRed').classList.toggle('active-side', phase === 'ban' && banSide === 'red');
    const steps = pickSteps();
    if (pickCur >= steps.length) {
      turn.innerHTML = '<span class="b">蓝方</span> vs <span class="r">红方</span>';
      finish.hidden = false;
      banCtl.hidden = true;
      startBtn.hidden = true;
      const bansOf = s => slots[s].ban.map(id => byId[id].cname).join('、') || '无';
      const picksOf = s => slots[s].pick.map(id => byId[id].cname).join('、');
      document.getElementById('verdict').innerHTML =
        `<span class="b">蓝方</span> 禁:${bansOf('blue')} 选:${picksOf('blue')}<br>` +
        `<span class="r">红方</span> 禁:${bansOf('red')} 选:${picksOf('red')}`;
      return;
    }
    finish.hidden = true;
    document.getElementById('verdict').textContent = '';
    if (phase === 'ban') {
      turn.innerHTML = '禁用阶段 · <span class="b">蓝 ' + slots.blue.ban.length + '</span>/<span class="r">红 ' + slots.red.ban.length + '</span>';
      document.getElementById('turnSub').textContent =
        `双方同时各禁 5 名,可禁同一英雄;点击英雄禁给当前操作方,选好点「开始选人」`;
      banCtl.hidden = false;
      startBtn.hidden = false;
      startBtn.innerHTML = `<span class="ms">skip_next</span>开始选人（已禁 ${slots.blue.ban.length}+${slots.red.ban.length}/10）`;
    } else {
      const st = steps[pickCur];
      turn.innerHTML = `第 ${pickCur + 1} 手 · <span class="${st.s[0]}">${SIDE_NAME[st.s]}</span> 选用`;
      document.getElementById('turnSub').textContent =
        `${SIDE_NAME[firstPick]}先选,顺序 1-2-2-2-2-1,双方各选满 5 名;被禁用的英雄不可选`;
      banCtl.hidden = true;
      startBtn.hidden = true;
    }
  }
  function renderAll() { renderIntent(); renderSlots(); renderTimeline(); renderTurn(); renderPool(); }

  /* ---------- 顶栏操作 ---------- */
  document.getElementById('undoBtn').addEventListener('click', undo);
  const startBtn = document.getElementById('startPick');
  startBtn.addEventListener('click', startPick);
  const tgBlue = document.getElementById('tgBlue');
  const tgRed = document.getElementById('tgRed');
  function setBanSide(s) {
    banSide = s;
    tgBlue.classList.toggle('on', s === 'blue');
    tgRed.classList.toggle('on', s === 'red');
    renderAll();
  }
  tgBlue.addEventListener('click', () => setBanSide('blue'));
  tgRed.addEventListener('click', () => setBanSide('red'));
  /* 先选方切换:仅禁用阶段可改,选人开始后隐藏锁定 */
  document.getElementById('fpBtn').addEventListener('click', () => {
    firstPick = firstPick === 'blue' ? 'red' : 'blue';
    syncFpBtn();
    renderAll();
  });
  /* 重置需二次确认:第一次点击进入待确认态,3 秒内再点生效 */
  const resetBtn = document.getElementById('resetBtn');
  const RESET_LABEL = resetBtn.innerHTML;
  let resetArmedAt = 0, resetTimer = null;
  resetBtn.addEventListener('click', () => {
    if (ops.length === 0 && phase === 'ban' && pickCur === 0) return;
    if (Date.now() - resetArmedAt < 3000) {
      clearTimeout(resetTimer);
      resetArmedAt = 0;
      resetBtn.innerHTML = RESET_LABEL;
      resetBtn.classList.remove('warn');
      reset();
    } else {
      resetArmedAt = Date.now();
      resetBtn.innerHTML = '<span class="ms">restart_alt</span>再点一次确认重置';
      resetBtn.classList.add('warn');
      resetTimer = setTimeout(() => {
        resetArmedAt = 0;
        resetBtn.innerHTML = RESET_LABEL;
        resetBtn.classList.remove('warn');
      }, 3000);
    }
  });

  /* ---------- 启动 ---------- */
  syncFpBtn();
  renderAll();
</script>
</body>
</html>
